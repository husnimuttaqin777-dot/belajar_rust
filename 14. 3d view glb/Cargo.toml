[package]
name = "viz3d_slint"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = "1.8"
gltf = "1"
rayon = "1"

[build-dependencies]
slint-build = "1.8"

# renderer 3D berjalan di CPU, jadi optimasi penting walau untuk `cargo run`
[profile.dev]
opt-level = 3

# dependensi (slint, gltf, rayon) juga dioptimasi di mode dev
[profile.dev.package."*"]
opt-level = 3